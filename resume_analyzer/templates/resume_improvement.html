<!DOCTYPE html>
<html>
<head>

    <title>AI Resume Improvement</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(
                135deg,
                #0f172a,
                #111827,
                #020617
            );
            min-height:100vh;
            color:white;
        }

        .main-container{
            max-width:900px;
            margin:auto;
            padding-top:50px;
        }

        .card-dark{
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(15px);
            border:1px solid rgba(255,255,255,0.1);
            border-radius:25px;
            padding:35px;
            box-shadow:0px 0px 30px rgba(0,212,255,0.15);
        }

        .title{
            text-align:center;
            font-size:2.8rem;
            font-weight:bold;
            color:#00d4ff;
            margin-bottom:15px;
        }

        .subtitle{
            text-align:center;
            color:#cbd5e1;
            margin-bottom:30px;
        }

        .btn-custom{
            width:100%;
            padding:12px;
            border-radius:12px;
            font-size:18px;
            font-weight:bold;
        }

        .result-box{
            margin-top:30px;
            background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,0.1);
            border-radius:15px;
            padding:25px;
        }

        .result-title{
            color:#38bdf8;
            margin-bottom:20px;
        }

        pre{
            color:#f8fafc;
            white-space:pre-wrap;
            word-wrap:break-word;
            font-size:15px;
            line-height:1.7;
            font-family:inherit;
        }

    </style>

</head>

<body>

<div class="container main-container">

    <div class="card-dark">

        <h1 class="title">
            🚀 AI Resume Improvement
        </h1>

        <p class="subtitle">
            Get AI-powered suggestions to improve your resume and increase your chances of getting shortlisted.
        </p>

        <form method="POST">

            {% csrf_token %}

            <button
                type="submit"
                class="btn btn-primary btn-custom">

                🔍 Analyze Resume

            </button>

        </form>

        {% if result %}

        <div class="result-box">

            <h3 class="result-title">
                📈 Improvement Suggestions
            </h3>

            <pre>
{{ result }}
            </pre>

        </div>

        {% endif %}

    </div>

</div>

</body>
</html>
