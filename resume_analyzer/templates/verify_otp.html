<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Email Verification</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a,
                #2563eb
            );

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

        }

        .container{

            width:420px;

            background:white;

            border-radius:20px;

            padding:40px;

            box-shadow:0px 15px 35px rgba(0,0,0,.25);

            animation:fade .5s ease;

        }

        @keyframes fade{

            from{
                opacity:0;
                transform:translateY(25px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        .icon{

            font-size:60px;

            text-align:center;

            margin-bottom:15px;

        }

        h2{

            text-align:center;

            color:#1d4ed8;

            margin-bottom:10px;

        }

        p{

            text-align:center;

            color:#666;

            margin-bottom:25px;

        }

        input{

            width:100%;

            padding:15px;

            border:1px solid #d1d5db;

            border-radius:10px;

            font-size:16px;

            outline:none;

            transition:.3s;

        }

        input:focus{

            border-color:#2563eb;

            box-shadow:0px 0px 8px rgba(37,99,235,.3);

        }

        button{

            width:100%;

            padding:15px;

            border:none;

            border-radius:10px;

            background:#2563eb;

            color:white;

            font-size:17px;

            font-weight:bold;

            cursor:pointer;

            transition:.3s;

        }

        button:hover{

            background:#1d4ed8;

        }

        .resend{

            text-align:center;

            margin-top:20px;

        }

        .resend a{

            color:#2563eb;

            text-decoration:none;

            font-weight:bold;

        }

        .resend a:hover{

            text-decoration:underline;

        }

        .message{

            margin-top:20px;

            padding:12px;

            border-radius:8px;

            background:#eff6ff;

            color:#1d4ed8;

            text-align:center;

            font-weight:bold;

            margin-bottom:10px;

        }

        @media(max-width:500px){

            .container{

                width:90%;

                padding:30px;

            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="icon">
        📧
    </div>

    <h2>Email Verification</h2>

    <p>
        Enter the 6-digit OTP sent to your email.
    </p>

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="otp"
            placeholder="Enter OTP"
            maxlength="6"
            required
        >

        <br><br>

        <button type="submit">

            Verify OTP

        </button>

    </form>

    <div class="resend">

        <a href="{% url 'resend_otp' %}">

            Resend OTP

        </a>

    </div>

    {% if messages %}

        {% for message in messages %}

            <div class="message">

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}

</div>

</body>

</html>
