<!DOCTYPE html>
<html>
<head>

<title>Password Changed</title>

<style>

body{
    background:linear-gradient(
        135deg,
        #0f172a,
        #111827,
        #020617
    );

    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.card{
    width:500px;
    background:rgba(255,255,255,0.05);
    padding:40px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 0 30px rgba(0,212,255,0.15);
}

h1{
    color:#22c55e;
}

a{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:10px;
}

</style>

</head>

<body>

<div class="card">

    <h1>✅ Password Changed Successfully</h1>

    <p>
        Your password has been updated successfully.
    </p>

    <a href="{% url 'login' %}">
        Login Now
    </a>

</div>

</body>
</html>
