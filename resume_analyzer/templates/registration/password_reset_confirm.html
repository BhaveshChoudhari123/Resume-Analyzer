<!DOCTYPE html>
<html>
<head>

<title>Set New Password</title>

<style>

body{
    background:linear-gradient(
        135deg,
        #0f172a,
        #111827,
        #020617
    );

    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.card{
    width:500px;
    background:rgba(255,255,255,0.05);
    padding:40px;
    border-radius:25px;
    box-shadow:0 0 30px rgba(0,212,255,0.15);
}

h1{
    color:#00d4ff;
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#1e293b;
    color:white;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#16a34a;
    color:white;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="card">

    <h1>🔒 Set New Password</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Change Password
        </button>

    </form>

</div>

</body>
</html>
