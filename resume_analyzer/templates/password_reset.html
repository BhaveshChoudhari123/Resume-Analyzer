<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(
                135deg,
                #0f172a,
                #111827,
                #020617
            );
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
        }

        .card-box{
            width:500px;
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(15px);
            border-radius:25px;
            padding:40px;
            box-shadow:0 0 30px rgba(0,212,255,0.15);
        }

        h1{
            text-align:center;
            color:#00d4ff;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#1e293b;
            color:white;
            margin-bottom:20px;
        }

        .btn-send{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:white;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="card-box">

    <h1>🔑 Reset Password</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn-send">
            Send Reset Link
        </button>

    </form>

</div>

</body>
</html>
