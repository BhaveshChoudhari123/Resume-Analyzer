<!DOCTYPE html>
<html>
<head>

    <title>Login - AI Resume Analyzer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(
                135deg,
                #0f172a,
                #111827,
                #020617
            );
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
        }

        .login-card{
            width:450px;
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(15px);
            border-radius:25px;
            padding:40px;
            box-shadow:0 0 30px rgba(0,212,255,0.15);
        }

        h1{
            color:#00d4ff;
            text-align:center;
            margin-bottom:25px;
        }

        .btn-login{
            width:100%;
        }

        a{
            color:#38bdf8;
        }

    </style>

</head>

<body>

<div class="login-card">

    <h1>🔐 Login</h1>

    

   <form method="POST">

{% csrf_token %}

<input
type="text"
name="username"
class="form-control mb-3"
placeholder="Username"
required
>

<input
type="password"
name="password"
class="form-control mb-3"
placeholder="Password"
required
>

<button
type="submit"
class="btn btn-primary w-100"
>
Login
</button>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-success">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

</form>

<br>

<p>
Don't have an account?
<a href="{% url 'register' %}">
Register
</a>
</p>

<p>
<a href="{% url 'password_reset' %}">
Forgot Password?
</a>
</p>

</div>

</body>
</html>
