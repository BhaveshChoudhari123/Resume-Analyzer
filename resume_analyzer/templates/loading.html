<!DOCTYPE html>
<html>
<head>
    <title>Analyzing Resume...</title>

    <style>

        body{
            margin:0;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#f5f7fb;
            font-family:Arial,sans-serif;
        }

        .container{
            width:500px;
            text-align:center;
        }

        h2{
            font-size:34px;
            margin-bottom:40px;
        }

        .progress{
            width:100%;
            height:28px;
            background:#ddd;
            border-radius:50px;
            overflow:hidden;
        }

        .bar{
            height:100%;
            width:0%;
            background:#00bcd4;
            border-radius:50px;
            transition:width .2s;
        }

        p{
            margin-top:20px;
            color:gray;
        }

    </style>

</head>

<body>

<div class="container">

<h2>Please wait while we analyze your resume...</h2>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<h3 id="percent">0%</h3>

<p>This usually takes about 10–15 seconds.</p>

</div>

<script>

let width=0;

let interval=setInterval(function(){

width++;

document.getElementById("bar").style.width=width+"%";

document.getElementById("percent").innerHTML=width+"%";

if(width>=100){

clearInterval(interval);

window.location.href="/analyzer/result/";

}

},120);

</script>

</body>
</html>
