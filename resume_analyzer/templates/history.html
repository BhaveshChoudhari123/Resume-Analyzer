<!DOCTYPE html>
<html>

<head>

    <title>Resume History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#121212;
            color:white;
        }

        .table{
            color:white;
        }

    </style>

</head>

<body>

<div class="container mt-5">

    <h1>
        Resume History
    </h1>

    <br>

    <a
    href="/"
    class="btn btn-primary">

    Back to Analyzer

    </a>

    <br><br>

    <table class="table table-dark table-bordered">

        <thead>

            <tr>

                <th>ID</th>

                <th>Resume Name</th>

                <th>Upload Date</th>

            </tr>

        </thead>

        <tbody>

            {% for resume in resumes %}

            <tr>

                <td>
                    {{ resume.id }}
                </td>

                <td>
                    {{ resume.resume_file.name }}
                </td>

                <td>
                    {{ resume.uploaded_at|date:"d M Y H:i:s" }}
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>

</html>
