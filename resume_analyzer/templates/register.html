<!DOCTYPE html>
<html>
<head>

<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:linear-gradient(135deg,#0f172a,#111827,#020617);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.register-card{
    width:500px;
    padding:40px;
    border-radius:25px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    box-shadow:0 0 30px rgba(0,212,255,0.15);
}

h1{
    color:#00d4ff;
    text-align:center;
    margin-bottom:25px;
}

input{
    margin-bottom:15px;
}

</style>

</head>

<body>

<div class="register-card">

<h1>📝 Register</h1>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-info">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="POST">

{% csrf_token %}

<input
type="text"
name="username"
class="form-control"
placeholder="Username"
required
>

<input
type="email"
name="email"
class="form-control"
placeholder="Email"
required
>

<input
type="password"
name="password1"
class="form-control"
placeholder="Password"
required
>

<input
type="password"
name="password2"
class="form-control"
placeholder="Confirm Password"
required
>

<button
type="submit"
class="btn btn-success w-100"
>
Create Account
</button>

</form>

<hr>

<p class="text-center text-white">

Already have an account?

<a href="{% url 'login' %}">
Login
</a>

</p>

</div>

</body>
</html>
