<!DOCTYPE html>
<html>

<head>
    <title>Reset Password</title>
</head>

<body>

<h2>Reset Password</h2>

<form method="POST">

    {% csrf_token %}

    <input
        type="text"
        name="otp"
        placeholder="Enter OTP"
        required
    >

    <br><br>

    <input
        type="password"
        name="password1"
        placeholder="New Password"
        required
    >

    <br><br>

    <input
        type="password"
        name="password2"
        placeholder="Confirm Password"
        required
    >

    <br><br>

    <button type="submit">

        Reset Password

    </button>

</form>

{% if messages %}

{% for message in messages %}

<p>{{ message }}</p>

{% endfor %}

{% endif %}

</body>

</html>
